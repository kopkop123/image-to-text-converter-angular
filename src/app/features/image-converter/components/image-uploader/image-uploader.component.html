
<div
  class="uploader"
  [class.uploader--dragging]="isDragging"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <div class="uploader__content">
    <div class="uploader__icon">
      <svg
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <rect x="3" y="3" width="18" height="18" rx="3" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <path d="m21 15-5-5L5 21" />
      </svg>
    </div>

    <h3 class="uploader__title">
      Drag an image here
    </h3>

    <p class="uploader__description">
      or select a file from your device
    </p>

    <label
      class="uploader__button"
      for="image-input"
    >
      Select an image
    </label>

    <input
      id="image-input"
      class="uploader__input"
      type="file"
      accept="image/jpeg,image/png"
      (change)="onFileChange($event)"
    />

    <p class="uploader__hint">
      JPEG and PNG are supported. The maximum size is 2 MB.
    </p>
  </div>
</div>
