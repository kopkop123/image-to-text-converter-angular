
<div class="preview">
  <div class="preview__header">
    <div>
      <h3 class="preview__title">Image preview</h3>
      <p class="preview__subtitle">
        The image is ready for recognition
      </p>
    </div>

    <button
      type="button"
      class="preview__remove"
      (click)="onRemove()"
      aria-label="Delete image"
      title="Delete image"
    >
      &times;
    </button>
  </div>

  <div class="preview__image-wrapper">
    <img
      class="preview__image"
      [src]="imageUrl"
      [alt]="fileName"
    />
  </div>

  <div class="preview__file-info">
    <div class="preview__file-icon">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
      >
        <rect x="3" y="3" width="18" height="18" rx="3" />
        <circle cx="8.5" cy="8.5" r="1.5" />
        <path d="m21 15-5-5L5 21" />
      </svg>
    </div>

    <div class="preview__file-details">
      <span class="preview__file-name">
        {{ fileName }}
      </span>

      <span class="preview__file-size">
        {{ formattedFileSize }}
      </span>
    </div>
  </div>
</div>
